[program:rag-api]
command=/opt/conda/bin/python3 /work/nas-rag-system/api/rag_api_server.py
user=carbon
directory=/work/nas-rag-system
autostart=false
autorestart=true
priority=30
stdout_logfile=/var/log/rag-api/out.log
stderr_logfile=/var/log/rag-api/err.log
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=PATH="/opt/conda/bin:/usr/local/bin:/usr/bin:/bin"
