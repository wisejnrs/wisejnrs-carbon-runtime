# Spark defaults for compute
spark.master                      local[*]
spark.driver.memory               4g

# Delta Lake — JAR fetched via Ivy at SparkContext startup
# Version matched to bundled Spark 3.4 + Scala 2.12 (see /spark/RELEASE).
# Note: Maven artifact is `delta-core` for Delta 2.x; the rename to
# `delta-spark` happened upstream in Delta 3.0 (which needs Spark 3.5+).
# The PyPI package name `delta-spark` is the same across both lines.
spark.jars.packages               io.delta:delta-core_2.12:2.4.0
spark.sql.extensions              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog   org.apache.spark.sql.delta.catalog.DeltaCatalog

# Stability
spark.executor.heartbeatInterval  30s
spark.network.timeout             600s

# Optional: Prometheus
spark.ui.prometheus.enabled       true